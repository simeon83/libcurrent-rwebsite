<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIBCURRENT RENEWABLE — Content Admin</title>
  <!-- Netlify Identity: handles the admin login itself -->
  <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Decap CMS (formerly Netlify CMS) — pinned to a known-stable version -->
  <script src="https://unpkg.com/decap-cms@3.11.0/dist/decap-cms.js"></script>
  <script>
    // Redirect back to /admin/ after login confirmation emails, invites, etc.
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
        }
      });
    }
  </script>
</body>
</html>
